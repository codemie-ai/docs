# White-label theme package template (kit version 1).
# Copy this file, fill in the values, then run:
#   apply-theme --render-only theme-package.yaml ./assets
# Fields marked REQUIRED must be filled in; fields marked optional may be omitted.
# This empty template intentionally does not pass validation until it is filled in.

version: '1' # REQUIRED - must be the string "1"

product:
  name: '' # REQUIRED - product name shown in the browser tab and UI headers
  shortName: '' # REQUIRED - abbreviated name for space-constrained surfaces

# REQUIRED - map of semantic token path to a dark and a light hex value (#rrggbb).
# Add one entry per token you want to override; tokens you omit keep the default theme.
colors: {}
# Example:
# colors:
#   surface.default:
#     dark: '#111111'
#     light: '#ffffff'

typography:
  bodyFamily: '' # REQUIRED - CSS font-family for UI text, for example 'Inter, sans-serif'
  bodyProseFamily: '' # REQUIRED - CSS font-family for long-form prose, for example 'Georgia, serif'
  codeFamily: '' # REQUIRED - CSS font-family for code, for example 'Fira Code, monospace'
  # optional - inline @font-face CSS. Font files cannot be shipped in the asset bundle,
  # so every src: url(...) must point to a font hosted on a reachable https URL.
  fontFaceCSS: null

# All assets are file names resolved against the assets directory passed to apply-theme.
# The combined size of the five files must stay below 1 MiB.
assets:
  logoLight: '' # REQUIRED - logo for the light theme (SVG)
  logoDark: '' # REQUIRED - logo for the dark theme (SVG)
  favicon: '' # REQUIRED - legacy favicon (.ico)
  faviconSvg: '' # REQUIRED - SVG favicon
  manifest: '' # REQUIRED - web app manifest (.webmanifest)

# The links block itself is REQUIRED. Each link is optional, but every link that is
# enabled in customer-config.yaml must be present here with a name and a URL.
links:
  userGuide: # optional
    name: ''
    url: ''
  videoPortal: # optional
    name: ''
    url: ''
  youtubeChannel: # optional
    name: ''
    url: ''
  learningCourses: # optional
    name: ''
    url: ''
  customerSupport: # optional
    name: ''
    url: ''
  userSurvey: # optional
    name: ''
    url: ''
  workflowDocumentation: # optional
    name: ''
    url: ''
  workflowYamlDocumentation: # optional
    name: ''
    url: ''
  googleDocsDocumentation: # optional
    name: ''
    url: ''
