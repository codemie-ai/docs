name: Documentation Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  commit-and-pr-validation:
    name: Commit & PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate last commit message
        run: git log -1 --format='%B' | npx commitlint --verbose

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint --verbose

      - name: Validation summary
        if: success()
        run: |
          echo "Conventional commits validation passed!"
          echo "- Commit message: PASSED"
          echo "- PR title: PASSED"

  secrets-detection:
    name: Security
    needs: commit-and-pr-validation
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    uses: codemie-ai/ci-workflows/.github/workflows/reusable-secrets-detection.yml@main

  linters:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: commit-and-pr-validation
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint:eslint

      - name: Run Prettier check
        run: npm run lint:prettier

      - name: Run Markdown linter
        run: npm run lint:markdown

      - name: Run spell check
        run: npm run lint:spelling

      - name: Linting summary
        if: success()
        run: |
          echo "All linting checks passed successfully!"
          echo "- TypeScript type checking: PASSED"
          echo "- ESLint: PASSED"
          echo "- Prettier: PASSED"
          echo "- Markdown linting: PASSED"
          echo "- Spell checking: PASSED"

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [secrets-detection, linters]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project with PR preview configuration
        run: npm run build
        env:
          DOCUSAURUS_URL: https://codemie-docs-pr-previews.s3.eu-central-1.amazonaws.com
          DOCUSAURUS_BASE_URL: /pr-${{ github.event.pull_request.number }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-pr-${{ github.event.pull_request.number }}
          path: build/
          retention-days: 1

      - name: Build summary
        if: success()
        run: |
          echo "Documentation build completed successfully!"
          echo "- Build: PASSED"
          echo "- Artifacts uploaded for PR #${{ github.event.pull_request.number }}"
