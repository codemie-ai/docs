name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    uses: codemie-ai/ci-workflows/.github/workflows/reusable-codeql.yml@84f121ac899deab768202d4a1f9164322737b8ae # pre-release snapshot
    with:
      language: ${{ matrix.language }}
