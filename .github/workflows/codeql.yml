name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    uses: codemie-ai/ci-workflows/.github/workflows/reusable-codeql.yml@main
    with:
      language: ${{ matrix.language }}
