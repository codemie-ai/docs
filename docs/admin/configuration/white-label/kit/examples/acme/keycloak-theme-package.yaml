# Keycloak login and email theme of the Acme example. It uses the same images as theme-package.yaml.
# The two packages share no file; the values below are written again on purpose.
themeName: 'acme-brand'

product:
  name: 'Acme Corp AI Platform'
  shortName: 'Acme'

colors:
  surface.base.primary:
    dark: '#121826'
    light: '#ffffff'
  text.primary:
    dark: '#f3f4f6'
    light: '#111827'
  text.accent:
    dark: '#ff9a4d'
    light: '#d95f00'

assets:
  logoLight: 'logo-light.svg'
  logoDark: 'logo-dark.svg'
  favicon: 'favicon.ico'
  faviconSvg: 'favicon.svg'

email:
  signature: 'The {productName} Team'
  palette:
    primary: '#0B5FFF'
    primaryText: '#FFFFFF'
    text: '#1F2933'
    background: '#F5F7FA'
    surface: '#FFFFFF'
  images:
    logo: 'email-logo.png'
    logoUrl: 'https://static.acme.example/logo.png'
